[project]
name = "gimbur-nn"
version = "0.1.0"
description = "Neural network training and inference for Catan state evaluation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.30",
    "fastapi>=0.115",
]
pipeline = [
    "matplotlib>=3.7",
]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_tokenizer.py" = ["E501"]
